<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcoursup – Quiz interactif</title>
<style>
:root {
  --blue:#1E3A5F; --blue-lt:#B3D1F7; --blue-md:#4A7DB5;
  --red:#C0392B;  --red-lt:#F7B3B3;
  --yel:#D4A800;  --yel-lt:#FFF9C4;
  --gry:#5D6D7E;  --gry-lt:#E0E0E0;
  --ok:#27AE60;   --wrong:#C0392B;
  --ink:#1A1A2E;  --bg:#F0F4FA;
  --r:12px; --sh:0 4px 18px rgba(0,0,0,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

/* HEADER */
header{background:var(--blue);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header h1{font-size:1.2rem;font-weight:700}
header p{font-size:.78rem;opacity:.75;margin-top:2px}
#score-bar{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.13);border-radius:8px;padding:7px 14px;font-size:.88rem}
#score-bar b{font-size:1.05rem}

/* NAV */
nav{display:flex;background:#fff;border-bottom:2px solid #D9E4F0;padding:0 24px;gap:4px}
.tab-btn{padding:12px 26px;border:none;background:none;font-size:.92rem;font-weight:600;color:var(--gry);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .2s,border-color .2s}
.tab-btn:hover{color:var(--blue-md)}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}

/* FILTER */
.filter-bar{display:flex;flex-wrap:wrap;gap:7px;padding:12px 24px;background:#fff;border-bottom:1px solid #E2EAF4;align-items:center}
.filter-bar label{font-size:.78rem;color:var(--gry);font-weight:700;margin-right:2px}
.chip{padding:4px 13px;border-radius:20px;border:2px solid transparent;font-size:.76rem;font-weight:600;cursor:pointer;background:#EEF2F8;color:var(--gry);transition:all .15s}
.chip.active{color:#fff}
.chip.f-all.active   {background:var(--blue);border-color:var(--blue)}
.chip.f-blue.active  {background:var(--blue-md);border-color:var(--blue-md)}
.chip.f-red.active   {background:var(--red);border-color:var(--red)}
.chip.f-yellow.active{background:var(--yel);border-color:var(--yel)}
.chip.f-grey.active  {background:var(--gry);border-color:var(--gry)}
.chip.f-todo.active  {background:#8E44AD;border-color:#8E44AD}
.reset-btn{margin-left:auto;padding:5px 14px;background:#fff;border:2px solid #D5DDE8;border-radius:8px;font-size:.76rem;font-weight:600;color:var(--gry);cursor:pointer;transition:border-color .15s}
.reset-btn:hover{border-color:var(--blue);color:var(--blue)}
#prog{font-size:.74rem;color:var(--gry);margin-left:4px}

/* VIEWS */
.view{display:none;padding:22px}
.view.active{display:block}

/* ══════════════════ CARD VIEW ══════════════════ */
#cards-grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}

.card-wrap{width:240px;min-height:360px;perspective:900px;cursor:default;flex-shrink:0;position:relative}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.card-wrap.flipped .card-inner{transform:rotateY(180deg)}

.card-face{
  position:absolute;width:100%;min-height:360px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r);box-shadow:var(--sh);
  border:3px solid #ccc;display:flex;flex-direction:column;background:#fff
}
.card-back-face{transform:rotateY(180deg)}

.card-wrap.col-blue  .card-face{border-color:var(--blue-md)}
.card-wrap.col-red   .card-face{border-color:var(--red)}
.card-wrap.col-yellow .card-face{border-color:var(--yel)}
.card-wrap.col-grey  .card-face{border-color:var(--gry)}

.c-num-badge{position:absolute;top:5px;right:7px;font-size:10px;font-weight:700;color:rgba(0,0,0,.3);pointer-events:none}
.c-title{text-align:center;font-size:12px;font-weight:700;padding:7px 20px 5px;background:#f2f4f8;color:#333;border-radius:var(--r) var(--r) 0 0}
.c-theme{font-size:10px;font-weight:600;text-align:center;padding:4px 6px;color:#fff}
.col-blue  .c-theme{background:#4A7DB5}
.col-red   .c-theme{background:#C0392B}
.col-yellow .c-theme{background:#D4A800}
.col-grey  .c-theme{background:#5D6D7E}

.c-type-badge{font-size:9px;text-align:center;padding:2px 6px;background:rgba(0,0,0,.07);color:#555;letter-spacing:.3px;font-weight:600}
.c-situation{padding:8px 9px;font-size:11px;line-height:1.45;background:#f9fafc;flex:1;color:#333;overflow-y:auto}
.c-choices{display:flex;flex-direction:column;flex-shrink:0;border-top:2px solid rgba(0,0,0,.06)}
.c-choice{
  padding:7px 8px 7px 26px;font-size:10.5px;line-height:1.35;
  border-top:1px solid rgba(0,0,0,.06);background:#e8f4fd;cursor:pointer;
  transition:background .15s;position:relative
}
.c-choice::before{
  content:attr(data-letter);position:absolute;left:7px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.18);color:#fff;
  font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:14px;text-align:center
}
.c-choice:hover:not(.locked){background:#c5e4f8}
.c-choice.correct{background:#d4edda !important;border-left:3px solid var(--ok)}
.c-choice.correct::before{background:var(--ok)}
.c-choice.wrong-picked{background:#fde8e8 !important;border-left:3px solid var(--wrong)}
.c-choice.wrong-picked::before{background:var(--wrong)}
.c-choice.wrong-shown{background:#f5f5f5 !important;opacity:.6}
.c-choice.locked{cursor:default}

/* Card type badge pour VF */
.c-vf-btns{display:flex;border-top:2px solid rgba(0,0,0,.06)}
.c-vf-btn{flex:1;padding:10px 4px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;transition:background .15s}
.c-vf-btn.vrai{background:#d4edda;border-right:1px solid rgba(0,0,0,.08)}
.c-vf-btn.faux{background:#fde8e8}
.c-vf-btn:hover:not(.locked){filter:brightness(.93)}
.c-vf-btn.selected-ok{background:var(--ok)!important;color:#fff}
.c-vf-btn.selected-wrong{background:var(--wrong)!important;color:#fff}
.c-vf-btn.revealed{opacity:.6;cursor:default}
.c-vf-btn.locked{cursor:default}

/* Blanks */
.c-blank-zone{padding:8px 9px;flex:1;display:flex;flex-direction:column;gap:6px;background:#f9fafc}
.c-blank-item{display:flex;align-items:center;gap:6px;font-size:10.5px;line-height:1.4;color:#333}
.c-blank-item input{
  border:2px solid #aac8e8;border-radius:6px;padding:3px 6px;font-size:10.5px;
  width:80px;outline:none;transition:border-color .15s
}
.c-blank-item input:focus{border-color:var(--blue-md)}
.c-blank-item input.ok{border-color:var(--ok);background:#d4edda}
.c-blank-item input.err{border-color:var(--wrong);background:#fde8e8}
.c-blank-submit{margin:6px 9px 8px;padding:6px;background:var(--blue-md);color:#fff;border:none;border-radius:7px;font-size:10.5px;font-weight:700;cursor:pointer;transition:background .15s}
.c-blank-submit:hover{background:var(--blue)}
.c-blank-submit:disabled{background:#aaa;cursor:default}

/* Card back */
.card-back-face{background:#fff}
.c-back-header{background:var(--blue);color:#fff;text-align:center;font-size:11px;font-weight:700;padding:6px 4px;border-radius:var(--r) var(--r) 0 0}
.c-back-body{padding:8px 10px;font-size:10.5px;line-height:1.5;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.back-item{padding:6px 8px;border-radius:7px;font-size:10.5px;line-height:1.4}
.back-item.ok-item{background:#d4edda;border-left:3px solid var(--ok)}
.back-item.wrong-item{background:#f5f5f5;opacity:.75}
.back-item .bi-letter{font-weight:700;margin-right:4px;font-size:10px}
.c-flip-hint{text-align:center;font-size:9px;color:#aaa;padding:5px;flex-shrink:0;cursor:pointer}

/* Status badge */
.status-badge{position:absolute;top:4px;left:4px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;z-index:10;pointer-events:none}
.status-badge.ok{background:var(--ok);color:#fff}
.status-badge.wrong{background:var(--wrong);color:#fff}

/* Mark-the-words card */
.c-mtw-text{padding:8px 10px;font-size:11px;line-height:1.7;flex:1;background:#f9fafc;cursor:pointer;user-select:none}
.c-mtw-text .w{display:inline;border-radius:3px;padding:1px 2px;transition:background .12s}
.c-mtw-text .w.clickable:hover{background:#c5e4f8}
.c-mtw-text .w.selected{background:#aac8e8;font-weight:600}
.c-mtw-text .w.hit{background:#d4edda;font-weight:600;color:#1a6b30}
.c-mtw-text .w.miss{background:#fde8e8;font-weight:600;color:#8b0000}
.c-mtw-text .w.unselected-target{background:#fff3cd;font-weight:600}
.c-mtw-submit{margin:6px 9px 8px;padding:6px;background:var(--blue-md);color:#fff;border:none;border-radius:7px;font-size:10.5px;font-weight:700;cursor:pointer}
.c-mtw-submit:hover{background:var(--blue)}
.c-mtw-submit:disabled{background:#aaa;cursor:default}

/* ══════════════════ LIST VIEW ══════════════════ */
#list-container{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:11px}
.list-item{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border-left:5px solid #ccc}
.list-item.col-blue  {border-left-color:var(--blue-md)}
.list-item.col-red   {border-left-color:var(--red)}
.list-item.col-yellow{border-left-color:var(--yel)}
.list-item.col-grey  {border-left-color:var(--gry)}

.list-hdr{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;user-select:none}
.l-num{flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;color:#fff}
.col-blue   .l-num{background:var(--blue-md)}
.col-red    .l-num{background:var(--red)}
.col-yellow .l-num{background:var(--yel)}
.col-grey   .l-num{background:var(--gry)}
.l-meta{flex:1;min-width:0}
.l-title{font-weight:700;font-size:.92rem}
.l-sub{font-size:.75rem;color:var(--gry);margin-top:1px}
.l-status{flex-shrink:0;font-size:1rem}
.l-arrow{flex-shrink:0;font-size:.95rem;color:#aaa;transition:transform .2s}
.list-item.open .l-arrow{transform:rotate(90deg)}

.list-body{display:none;padding:0 15px 15px 53px}
.list-item.open .list-body{display:block}
.l-question{font-size:.86rem;line-height:1.5;color:#444;margin-bottom:11px;padding:9px 12px;background:#F5F7FA;border-radius:8px}
.l-type-label{font-size:.72rem;font-weight:700;color:var(--gry);letter-spacing:.4px;margin-bottom:7px;text-transform:uppercase}

/* List choices */
.l-choices{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.l-choice{padding:9px 13px 9px 38px;border-radius:8px;border:2px solid #E2EAF4;font-size:.85rem;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:8px;background:#fff;position:relative}
.l-choice::before{content:attr(data-letter);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:#E2EAF4;color:var(--gry);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:20px;text-align:center}
.l-choice:hover:not(.locked){border-color:var(--blue-md);background:#EEF5FF}
.l-choice.correct{border-color:var(--ok);background:#EAF7EE}
.l-choice.correct::before{background:var(--ok);color:#fff}
.l-choice.wrong-picked{border-color:var(--wrong);background:#FDECEA}
.l-choice.wrong-picked::before{background:var(--wrong);color:#fff}
.l-choice.wrong-shown{opacity:.55;background:#fafafa}
.l-choice.locked{cursor:default}

/* List VF */
.l-vf-btns{display:flex;gap:8px;margin-bottom:10px}
.l-vf-btn{flex:1;padding:10px;text-align:center;border-radius:8px;border:2px solid #E2EAF4;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .15s}
.l-vf-btn.vrai{border-color:#27AE60;color:var(--ok)}
.l-vf-btn.faux{border-color:var(--wrong);color:var(--wrong)}
.l-vf-btn:hover:not(.locked){filter:brightness(.93)}
.l-vf-btn.selected-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.l-vf-btn.selected-wrong{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.l-vf-btn.revealed{opacity:.55;cursor:default}
.l-vf-btn.locked{cursor:default}

/* List blanks */
.l-blanks{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.l-blank-item{font-size:.86rem;line-height:1.5;color:#444;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.l-blank-item input{border:2px solid #aac8e8;border-radius:6px;padding:4px 8px;font-size:.84rem;width:100px;outline:none;transition:border-color .15s}
.l-blank-item input:focus{border-color:var(--blue-md)}
.l-blank-item input.ok{border-color:var(--ok);background:#d4edda}
.l-blank-item input.err{border-color:var(--wrong);background:#fde8e8}
.l-blank-submit{padding:7px 18px;background:var(--blue-md);color:#fff;border:none;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;margin-bottom:10px}
.l-blank-submit:hover{background:var(--blue)}
.l-blank-submit:disabled{background:#aaa;cursor:default}

/* List mark-the-words */
.l-mtw-text{font-size:.87rem;line-height:1.9;padding:10px 12px;background:#F5F7FA;border-radius:8px;margin-bottom:8px;cursor:pointer;user-select:none}
.l-mtw-text .w{display:inline;border-radius:3px;padding:1px 3px;transition:background .12s}
.l-mtw-text .w.clickable:hover{background:#c5e4f8}
.l-mtw-text .w.selected{background:#aac8e8;font-weight:600}
.l-mtw-text .w.hit{background:#d4edda;font-weight:600;color:#1a6b30}
.l-mtw-text .w.miss{background:#fde8e8;font-weight:600;color:#8b0000}
.l-mtw-text .w.unselected-target{background:#fff3cd;font-weight:600}
.l-mtw-submit{padding:7px 18px;background:var(--blue-md);color:#fff;border:none;border-radius:8px;font-size:.83rem;font-weight:700;cursor:pointer;margin-bottom:10px}
.l-mtw-submit:hover{background:var(--blue)}
.l-mtw-submit:disabled{background:#aaa;cursor:default}

/* Feedbacks */
.l-feedback{display:none;font-size:.82rem;line-height:1.5;border-radius:8px;padding:9px 12px;margin-top:4px}
.l-feedback.show{display:block}
.l-feedback.ok-fb{background:#EAF7EE;border-left:4px solid var(--ok);color:#1E5C30}
.l-feedback.wrong-fb{background:#FDECEA;border-left:4px solid var(--wrong);color:#7B1010}
.l-feedback.info-fb{background:#EEF5FF;border-left:4px solid var(--blue-md);color:#1a3a6b}

/* Tags */
.l-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{padding:2px 9px;border-radius:12px;font-size:.68rem;font-weight:600;background:#EEF2F8;color:var(--gry)}

/* Empty */
.empty{text-align:center;padding:60px 20px;color:var(--gry)}
.empty p{font-size:.95rem;margin-top:7px}

@media(max-width:600px){
  header{padding:10px 14px}
  .view{padding:14px 10px}
  .filter-bar,.nav{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🎓 Parcoursup — Quiz interactif</h1>
    <p>54 questions · Classe de 1re · QCM, Vrai/Faux, Mots à trous, Surligner</p>
  </div>
  <div id="score-bar">✅ <b id="s-ok">0</b>&nbsp; ❌ <b id="s-ko">0</b>&nbsp; / <b>54</b></div>
</header>

<nav>
  <button class="tab-btn active" data-view="cards">🃏 Cartes</button>
  <button class="tab-btn" data-view="list">📋 Liste</button>
</nav>

<div class="filter-bar">
  <label>Thème :</label>
  <button class="chip f-all active" data-f="all">Tout</button>
  <button class="chip f-blue"   data-f="blue">🔵 Formations (1–17)</button>
  <button class="chip f-red"    data-f="red">🔴 Candidats (18–27)</button>
  <button class="chip f-yellow" data-f="yellow">🟡 Plate-forme (28–42)</button>
  <button class="chip f-grey"   data-f="grey">⚪ Vigilance (43–54)</button>
  <button class="chip f-todo"   data-f="todo">⏳ À répondre</button>
  <button class="reset-btn" id="reset-btn">🔄 Réinitialiser</button>
  <span id="prog"></span>
</div>

<div class="view active" id="view-cards">
  <div id="cards-grid"></div>
  <div class="empty" id="ce" style="display:none"><div style="font-size:2.5rem">🔍</div><p>Aucune carte pour ce filtre.</p></div>
</div>

<div class="view" id="view-list">
  <div id="list-container"></div>
  <div class="empty" id="le" style="display:none"><div style="font-size:2.5rem">🔍</div><p>Aucune question pour ce filtre.</p></div>
</div>

<script>
// ═══════════════════════════════════════════════
// QUESTIONS DATA  (type: qcm|vf|blanks|mark)
// ═══════════════════════════════════════════════
const QS = [
{id:1,color:"blue",theme:"Formations",title:"Formations sélectives",type:"qcm",multi:true,
 q:"Parmi les formations suivantes, lesquelles sont <strong>sélectives</strong> ?",
 choices:[
  {t:"BTS (Brevet de technicien supérieur)",ok:true},
  {t:"BUT (Bachelor universitaire de technologie)",ok:true},
  {t:"CPGE (Classe préparatoire aux grandes écoles)",ok:true},
  {t:"Licence",ok:false,fb:"La Licence n'est pas sélective : toutes les candidatures reçues sont classées."},
  {t:"École d'ingénieur",ok:true},
 ],tags:["Formations","Sélectivité"]},

{id:2,color:"blue",theme:"Formations",title:"Critères d'analyse",type:"qcm",multi:false,
 q:"<strong>Qui établit les critères d'analyse des candidatures ?</strong>",
 choices:[
  {t:"Les formations",ok:true},
  {t:"Les candidats",ok:false,fb:"Les candidats ne fixent pas les critères ; ils y répondent."},
  {t:"La plateforme Parcoursup",ok:false,fb:"Parcoursup est un outil de mise en relation, pas un décideur de critères."},
 ],tags:["Formations","Procédure"]},

{id:3,color:"blue",theme:"Formations",title:"Qui classe les candidatures ?",type:"qcm",multi:false,
 q:"<strong>Qui étudie et classe les candidatures ?</strong>",
 choices:[
  {t:"Les formations",ok:true},
  {t:"Le ministère de l'Éducation nationale",ok:false,fb:"Le ministère cadre la procédure mais ne classe pas les dossiers."},
  {t:"La plateforme Parcoursup",ok:false,fb:"Parcoursup transmet les candidatures mais ne les classe pas."},
  {t:"Les lycées d'origine des candidats",ok:false,fb:"Les lycées fournissent les bulletins mais ne classent pas les candidatures."},
 ],tags:["Formations","Procédure"]},

{id:4,color:"blue",theme:"Formations",title:"Critères variables",type:"vf",
 q:"Pour une même formation, les critères d'examen des vœux <strong>varient-ils d'un établissement à un autre</strong> ?",
 correct:true,
 fbTrue:"✔ Oui ! Chaque formation définit ses critères d'examen des vœux de façon autonome.",
 fbFalse:"✘ En réalité oui : chaque établissement est libre de définir ses propres critères.",
 tags:["Procédure","Établissements"]},

{id:5,color:"blue",theme:"Formations",title:"Places réservées par bac",type:"qcm",multi:true,
 q:"Citez les types de formations où il existe des <strong>places réservées à une série de baccalauréat</strong>.",
 choices:[
  {t:"BTS",ok:true},
  {t:"BUT",ok:true},
  {t:"Licence",ok:false,fb:"La licence ne réserve pas de places selon la série de bac."},
  {t:"CPGE",ok:false,fb:"La CPGE est sélective mais ne réserve pas de places par série de bac."},
 ],tags:["Formations","Places réservées"]},

{id:6,color:"blue",theme:"Formations",title:"Licence non-sélective",type:"qcm",multi:true,
 q:"Comment sont traitées les candidatures dans une <strong>licence non-sélective</strong> ?",
 choices:[
  {t:"Toutes les candidatures reçues sont classées, mais l'accès reste conditionné au nombre de places.",ok:true},
  {t:"Une sectorisation géographique s'applique.",ok:true},
  {t:"Des groupes de candidats sont formés en fonction de la série de bac.",ok:false,fb:"Ce mécanisme concerne les BTS et BUT, pas les licences."},
  {t:"Les lycéens sont toujours prioritaires sur les étudiants en réorientation.",ok:false,fb:"Il n'existe pas de priorité automatique selon ce critère."},
 ],tags:["Formations","Sectorisation"]},

{id:7,color:"blue",theme:"Formations",title:"Admission apprentissage",type:"qcm",multi:false,
 q:"Que faut-il pour être <strong>admis en apprentissage</strong> ?",
 choices:[
  {t:"Signer un contrat avec une entreprise",ok:true},
  {t:"Obtenir une mention au baccalauréat",ok:false,fb:"Aucune mention spécifique n'est exigée pour l'apprentissage."},

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const S = { answers:{}, view:'cards', filter:'all' };

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function isAnswered(q){
  const a = S.answers[q.id];
  if(!a) return false;
  if(q.type==='qcm')   return a.done===true;
  if(q.type==='vf')    return a.choice!==undefined;
  if(q.type==='blanks')return a.done===true;
  if(q.type==='mark')  return a.done===true;
  return false;
}
function isCorrect(q){
  const a = S.answers[q.id];
  if(!a || !isAnswered(q)) return null;
  return a.correct===true;
}
function filtered(){ return QS.filter(q=>{
  if(S.filter==='all')   return true;
  if(S.filter==='todo')  return !isAnswered(q);
  return q.color===S.filter;
});}

// ═══════════════════════════════════════════════
// SCORE
// ═══════════════════════════════════════════════
function updateScore(){
  let ok=0,ko=0;
  QS.forEach(q=>{ const c=isCorrect(q); if(c===true)ok++; else if(c===false)ko++; });
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-ko').textContent=ko;
  const done=QS.filter(q=>isAnswered(q)).length;
  document.getElementById('prog').textContent=`${done} / 54 répondues`;
}

// ═══════════════════════════════════════════════
// PARSE mark-the-words text  [word] = target
// ═══════════════════════════════════════════════
function parseMTW(raw){
  // Returns array of {text, isTarget}
  const tokens=[];
  const re=/\[([^\]]+)\]|(\S+)/g;
  let m;
  while((m=re.exec(raw))!==null){
    if(m[1]) tokens.push({text:m[1],isTarget:true});
    else     tokens.push({text:m[2],isTarget:false});
  }
  return tokens;
}

// ═══════════════════════════════════════════════
// BUILD CARD RECTO – type-specific content
// ═══════════════════════════════════════════════
function buildCardFront(q){
  const div=document.createElement('div');
  div.className='card-face card-front-face';

  const typeLabel=q.type==='qcm'?(q.multi?'✅ Plusieurs bonnes réponses':'✅ Une seule bonne réponse'):
                  q.type==='vf'?'⚖️ Vrai ou Faux ?':
                  q.type==='blanks'?'✏️ Mots à trous':'🖱️ Surligne les mots';

  div.innerHTML=`
    <div class="c-title">${q.title}</div>
    <div class="c-theme">${q.theme}</div>
    <div class="c-type-badge">${typeLabel}</div>
    <div class="c-situation">${q.q}</div>
    <div class="c-num-badge">${q.id}</div>
  `;

  const a=S.answers[q.id]||{};
  const done=isAnswered(q);

  if(q.type==='qcm'){
    const choicesDiv=document.createElement('div');
    choicesDiv.className='c-choices';
    const letters='ABCDEFGH';
    q.choices.forEach((ch,i)=>{
      const btn=document.createElement('div');
      btn.className='c-choice';
      btn.dataset.letter=letters[i];
      btn.setAttribute('data-letter',letters[i]);
      btn.textContent=ch.t;
      if(done){
        btn.classList.add('locked');
        if(ch.ok) btn.classList.add('correct');
        else if(a.picked && a.picked.includes(i)) btn.classList.add('wrong-picked');
        else btn.classList.add('wrong-shown');
      } else {
        btn.addEventListener('click',()=>handleQCMClick(q,i,btn,choicesDiv));
      }
      choicesDiv.appendChild(btn);
    });
    div.appendChild(choicesDiv);
  }
  else if(q.type==='vf'){
    const vfDiv=document.createElement('div');
    vfDiv.className='c-vf-btns';
    ['Vrai','Faux'].forEach(label=>{
      const btn=document.createElement('div');
      btn.className='c-vf-btn '+(label==='Vrai'?'vrai':'faux');
      btn.textContent=label==='Vrai'?'✔ Vrai':'✘ Faux';
      if(done){
        btn.classList.add('locked');
        const picked=a.choice;
        const isVrai=label==='Vrai';
        if(picked===isVrai){
          btn.classList.add(a.correct?'selected-ok':'selected-wrong');
        } else {
          btn.classList.add('revealed');
        }
      } else {
        btn.addEventListener('click',()=>handleVFClick(q,label==='Vrai',btn,vfDiv));
      }
      vfDiv.appendChild(btn);
    });
    div.appendChild(vfDiv);
  }
  else if(q.type==='blanks'){
    const zone=document.createElement('div');
    zone.className='c-blank-zone';
    const inputs=[];
    q.blanks.forEach((bl,bi)=>{
      const item=document.createElement('div');
      item.className='c-blank-item';
      const inp=document.createElement('input');
      inp.type='text';
      inp.placeholder='?';
      if(done){ inp.value=a.vals?.[bi]||''; inp.disabled=true; inp.className=a.correct?'ok':'err'; }
      inputs.push(inp);
      item.innerHTML=`<span>${bl.before}</span>`;
      item.appendChild(inp);
      item.innerHTML+=`<span>${bl.after}</span>`;
      // fix: need to re-append input after innerHTML
      item.insertBefore(inp, item.children[1]);
      zone.appendChild(item);
    });
    if(!done){
      const sub=document.createElement('button');
      sub.className='c-blank-submit';
      sub.textContent='Valider';
      sub.addEventListener('click',()=>handleBlanksSubmit(q,inputs));
      zone.appendChild(sub);
    }
    div.appendChild(zone);
  }
  else if(q.type==='mark'){
    const tokens=parseMTW(q.text);
    const textDiv=document.createElement('div');
    textDiv.className='c-mtw-text';
    const sel=new Set(a.selected||[]);
    tokens.forEach((tok,ti)=>{
      const span=document.createElement('span');
      span.className='w';
      span.textContent=tok.text+' ';
      if(done){
        if(tok.isTarget && sel.has(ti))  span.classList.add('hit');
        else if(tok.isTarget)             span.classList.add('unselected-target');
        else if(sel.has(ti))              span.classList.add('miss');
      } else {
        span.classList.add('clickable');
        if(sel.has(ti)) span.classList.add('selected');
        span.addEventListener('click',()=>{
          if(sel.has(ti)){ sel.delete(ti); span.classList.remove('selected'); }
          else { sel.add(ti); span.classList.add('selected'); }
          S.answers[q.id]={...(S.answers[q.id]||{}),selected:[...sel]};
        });
      }
      textDiv.appendChild(span);
    });
    div.appendChild(textDiv);
    if(!done){
      const sub=document.createElement('button');
      sub.className='c-mtw-submit';
      sub.textContent='Valider';
      sub.addEventListener('click',()=>handleMTWSubmit(q,sel,tokens));
      div.appendChild(sub);
    }
  }
  return div;
}

function buildCardBack(q){
  const div=document.createElement('div');
  div.className='card-face card-back-face';
  div.innerHTML=`<div class="c-back-header">💡 Réponse — ${q.title}</div>`;
  const body=document.createElement('div');
  body.className='c-back-body';

  if(q.type==='qcm'){
    const letters='ABCDEFGH';
    q.choices.forEach((ch,i)=>{
      const item=document.createElement('div');
      item.className='back-item '+(ch.ok?'ok-item':'wrong-item');
      item.innerHTML=`<span class="bi-letter">${letters[i]}.</span> ${ch.t}${ch.fb?` <em style="font-size:9.5px;display:block;margin-top:2px;opacity:.8">${ch.fb}</em>`:''}`;
      body.appendChild(item);
    });
  } else if(q.type==='vf'){
    const rep=q.correct?'✔ Vrai':'✘ Faux';
    body.innerHTML=`<div class="back-item ok-item"><strong>Réponse : ${rep}</strong><br><br>${q.fbTrue}<br><br>${q.fbFalse}</div>`;
  } else if(q.type==='blanks'){
    q.blanks.forEach((bl,i)=>{
      const item=document.createElement('div');
      item.className='back-item ok-item';
      item.innerHTML=`${bl.before} <strong>${bl.answer[0]}</strong> ${bl.after}`;
      body.appendChild(item);
    });
  } else if(q.type==='mark'){
    const tokens=parseMTW(q.text);
    const targets=tokens.filter(t=>t.isTarget).map(t=>t.text);
    body.innerHTML=`<div class="back-item ok-item"><strong>Mots à surligner :</strong><br>${targets.map(t=>`<em>${t}</em>`).join(' · ')}</div>`;
  }

  div.appendChild(body);
  div.innerHTML+=`<div class="c-num-badge">${q.id}</div>`;
  const hint=document.createElement('div');
  hint.className='c-flip-hint';
  hint.textContent='Cliquer pour revenir à la question';
  div.appendChild(hint);
  div.addEventListener('click',()=>{
    const wrap=div.closest('.card-wrap');
    if(wrap) wrap.classList.toggle('flipped');
  });
  return div;
}

// ═══════════════════════════════════════════════
// HANDLERS – Card
// ═══════════════════════════════════════════════
function handleQCMClick(q,idx,btn,choicesDiv){
  if(!S.answers[q.id]) S.answers[q.id]={picked:[]};
  const a=S.answers[q.id];
  if(q.multi){
    const pi=a.picked.indexOf(idx);
    if(pi>=0){ a.picked.splice(pi,1); btn.style.background=''; btn.style.borderLeft=''; }
    else { a.picked.push(idx); btn.style.background='#c5e4f8'; }
    // Add validate button if not present
    if(!choicesDiv.querySelector('.validate-multi-btn')){
      const vbtn=document.createElement('div');
      vbtn.className='c-choice validate-multi-btn';
      vbtn.style.cssText='background:#1E3A5F;color:#fff;font-weight:700;text-align:center;cursor:pointer;padding:8px';
      vbtn.textContent='✔ Valider ma sélection';
      vbtn.addEventListener('click',()=>finalizeQCM(q,choicesDiv));
      choicesDiv.appendChild(vbtn);
    }
  } else {
    S.answers[q.id].picked=[idx];
    finalizeQCM(q,choicesDiv);
  }
}

function finalizeQCM(q,choicesDiv){
  const a=S.answers[q.id];
  const picked=a.picked||[];
  const correctSet=new Set(q.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0));
  const correct= picked.length===correctSet.size && picked.every(i=>correctSet.has(i));
  a.done=true; a.correct=correct;
  // Re-render card
  const wrap=choicesDiv.closest('.card-wrap');
  if(wrap){
    const inner=wrap.querySelector('.card-inner');
    inner.innerHTML='';
    inner.appendChild(buildCardFront(q));
    inner.appendChild(buildCardBack(q));
    setTimeout(()=>{ wrap.classList.add('flipped'); addStatusBadge(wrap,correct); updateScore(); },300);
  }
}

function handleVFClick(q,choice,btn,vfDiv){
  const correct=(choice===q.correct);
  S.answers[q.id]={choice,done:true,correct};
  const wrap=vfDiv.closest('.card-wrap');
  if(wrap){
    const inner=wrap.querySelector('.card-inner');
    inner.innerHTML='';
    inner.appendChild(buildCardFront(q));
    inner.appendChild(buildCardBack(q));
    setTimeout(()=>{ wrap.classList.add('flipped'); addStatusBadge(wrap,correct); updateScore(); },300);
  }
}

function handleBlanksSubmit(q,inputs){
  const vals=inputs.map(i=>i.value.trim().toLowerCase());
  let allOk=true;
  q.blanks.forEach((bl,i)=>{ if(!bl.answer.map(a=>a.toLowerCase()).includes(vals[i])) allOk=false; });
  S.answers[q.id]={done:true,correct:allOk,vals};
  const wrap=inputs[0].closest('.card-wrap');
  if(wrap){
    const inner=wrap.querySelector('.card-inner');
    inner.innerHTML='';
    inner.appendChild(buildCardFront(q));
    inner.appendChild(buildCardBack(q));
    setTimeout(()=>{ wrap.classList.add('flipped'); addStatusBadge(wrap,allOk); updateScore(); },300);
  }
}

function handleMTWSubmit(q,sel,tokens){
  const targetIdxs=new Set(tokens.map((t,i)=>t.isTarget?i:-1).filter(i=>i>=0));
  const correct=[...sel].every(i=>targetIdxs.has(i)) && [...targetIdxs].every(i=>sel.has(i));
  S.answers[q.id]={done:true,correct,selected:[...sel]};
  const wrap=document.querySelector(`.card-wrap[data-id="${q.id}"]`);
  if(wrap){
    const inner=wrap.querySelector('.card-inner');
    inner.innerHTML='';
    inner.appendChild(buildCardFront(q));
    inner.appendChild(buildCardBack(q));
    setTimeout(()=>{ wrap.classList.add('flipped'); addStatusBadge(wrap,correct); updateScore(); },300);
  }
}

function addStatusBadge(wrap,correct){
  wrap.querySelectorAll('.status-badge').forEach(b=>b.remove());
  const badge=document.createElement('div');
  badge.className='status-badge '+(correct?'ok':'wrong');
  badge.textContent=correct?'✓':'✗';
  wrap.appendChild(badge);
  updateScore();
}

// ═══════════════════════════════════════════════
// BUILD CARDS VIEW
// ═══════════════════════════════════════════════
function buildCards(){
  const grid=document.getElementById('cards-grid');
  const empty=document.getElementById('ce');
  grid.innerHTML='';
  const vis=filtered();
  empty.style.display=vis.length?'none':'block';
  vis.forEach(q=>{
    const wrap=document.createElement('div');
    wrap.className=`card-wrap col-${q.color}`;
    wrap.dataset.id=q.id;
    if(isAnswered(q)) wrap.classList.add('flipped');

    const inner=document.createElement('div');
    inner.className='card-inner';
    inner.appendChild(buildCardFront(q));
    inner.appendChild(buildCardBack(q));
    wrap.appendChild(inner);

    const c=isCorrect(q);
    if(c===true)  { const b=document.createElement('div');b.className='status-badge ok';b.textContent='✓';wrap.appendChild(b); }
    if(c===false) { const b=document.createElement('div');b.className='status-badge wrong';b.textContent='✗';wrap.appendChild(b); }

    grid.appendChild(wrap);
  });
}

// ═══════════════════════════════════════════════
// BUILD LIST VIEW
// ═══════════════════════════════════════════════
function buildList(){
  const cont=document.getElementById('list-container');
  const empty=document.getElementById('le');
  cont.innerHTML='';
  const vis=filtered();
  empty.style.display=vis.length?'none':'block';
  vis.forEach(q=>{ cont.appendChild(buildListItem(q)); });
}

function buildListItem(q){
  const done=isAnswered(q);
  const cor=isCorrect(q);
  const icon=!done?'⬜':cor?'✅':'❌';
  const typeLabel=q.type==='qcm'?(q.multi?'Plusieurs bonnes réponses':'Une seule bonne réponse'):
                  q.type==='vf'?'Vrai ou Faux':q.type==='blanks'?'Mots à trous':'Surligner les mots';

  const item=document.createElement('div');
  item.className=`list-item col-${q.color}`;
  item.innerHTML=`
    <div class="list-hdr">
      <div class="l-num">${q.id}</div>
      <div class="l-meta">
        <div class="l-title">${q.title}</div>
        <div class="l-sub">${q.theme} · ${typeLabel}</div>
      </div>
      <div class="l-status">${icon}</div>
      <div class="l-arrow">›</div>
    </div>
    <div class="list-body"></div>
  `;
  item.querySelector('.list-hdr').addEventListener('click',()=>item.classList.toggle('open'));
  const body=item.querySelector('.list-body');

  // Question
  const qDiv=document.createElement('div');
  qDiv.className='l-question';
  qDiv.innerHTML=q.q;
  body.appendChild(qDiv);

  // Type label
  const tl=document.createElement('div');
  tl.className='l-type-label';
  tl.textContent=typeLabel;
  body.appendChild(tl);

  // Type-specific
  if(q.type==='qcm'){
    const a=S.answers[q.id]||{};
    const letters='ABCDEFGH';
    const choicesDiv=document.createElement('div');
    choicesDiv.className='l-choices';

    q.choices.forEach((ch,i)=>{
      const btn=document.createElement('div');
      btn.className='l-choice';
      btn.setAttribute('data-letter',letters[i]);
      btn.innerHTML=ch.t;
      if(done){
        btn.classList.add('locked');
        if(ch.ok) btn.classList.add('correct');
        else if(a.picked && a.picked.includes(i)) btn.classList.add('wrong-picked');
        else btn.classList.add('wrong-shown');
      } else {
        btn.addEventListener('click',()=>handleListQCMClick(q,i,choicesDiv,body,item));
      }
      choicesDiv.appendChild(btn);
    });
    body.appendChild(choicesDiv);

    if(done){
      q.choices.filter(c=>!c.ok && c.fb).forEach(ch=>{
        const fb=document.createElement('div');
        fb.className='l-feedback show info-fb';
        fb.innerHTML=`<strong>${letters[q.choices.indexOf(ch)]}.</strong> ${ch.fb}`;
        body.appendChild(fb);
      });
    }
  }
  else if(q.type==='vf'){
    const a=S.answers[q.id]||{};
    const vfDiv=document.createElement('div');
    vfDiv.className='l-vf-btns';
    ['Vrai','Faux'].forEach(label=>{
      const btn=document.createElement('div');
      btn.className='l-vf-btn '+(label==='Vrai'?'vrai':'faux');
      btn.textContent=label==='Vrai'?'✔ Vrai':'✘ Faux';
      if(done){
        btn.classList.add('locked');
        const isVrai=label==='Vrai';
        if(a.choice===isVrai){ btn.classList.add(a.correct?'selected-ok':'selected-wrong'); }
        else btn.classList.add('revealed');
      } else {
        btn.addEventListener('click',()=>{
          const choice=label==='Vrai';
          const correct=(choice===q.correct);
          S.answers[q.id]={choice,done:true,correct};
          updateScore();
          const newItem=buildListItem(q);
          newItem.classList.add('open');
          item.replaceWith(newItem);
        });
      }
      vfDiv.appendChild(btn);
    });
    body.appendChild(vfDiv);
    if(done){
      const fb=document.createElement('div');
      const cor2=isCorrect(q);
      fb.className='l-feedback show '+(cor2?'ok-fb':'wrong-fb');
      fb.innerHTML=cor2?q.fbTrue:q.fbFalse;
      body.appendChild(fb);
    }
  }
  else if(q.type==='blanks'){
    const a=S.answers[q.id]||{};
    const blDiv=document.createElement('div');
    blDiv.className='l-blanks';
    const inputs=[];
    q.blanks.forEach((bl,bi)=>{
      const wrap2=document.createElement('div');
      wrap2.className='l-blank-item';
      const inp=document.createElement('input');
      inp.type='text'; inp.placeholder='?';
      if(done){ inp.value=a.vals?.[bi]||''; inp.disabled=true; inp.className=a.correct?'ok':'err'; }
      wrap2.innerHTML=`<span>${bl.before}</span>`;
      wrap2.appendChild(inp);
      const aft=document.createElement('span');
      aft.textContent=bl.after;
      wrap2.appendChild(aft);
      blDiv.appendChild(wrap2);
      inputs.push(inp);
    });
    body.appendChild(blDiv);
    if(!done){
      const sub=document.createElement('button');
      sub.className='l-blank-submit';
      sub.textContent='Valider';
      sub.addEventListener('click',()=>{
        const vals=inputs.map(i=>i.value.trim().toLowerCase());
        let allOk=true;
        q.blanks.forEach((bl,i)=>{ if(!bl.answer.map(a=>a.toLowerCase()).includes(vals[i])) allOk=false; });
        S.answers[q.id]={done:true,correct:allOk,vals};
        updateScore();
        const newItem=buildListItem(q);
        newItem.classList.add('open');
        item.replaceWith(newItem);
      });
      body.appendChild(sub);
    } else {
      const fb=document.createElement('div');
      fb.className='l-feedback show '+(isCorrect(q)?'ok-fb':'wrong-fb');
      fb.innerHTML=isCorrect(q)?'✔ Toutes les réponses sont correctes !':
        'Réponses attendues : '+q.blanks.map(bl=>`<strong>${bl.answer[0]}</strong>`).join(', ');
      body.appendChild(fb);
    }
  }
  else if(q.type==='mark'){
    const a=S.answers[q.id]||{};
    const tokens=parseMTW(q.text);
    const sel=new Set(a.selected||[]);
    const textDiv=document.createElement('div');
    textDiv.className='l-mtw-text';
    tokens.forEach((tok,ti)=>{
      const span=document.createElement('span');
      span.className='w';
      span.textContent=tok.text+' ';
      if(done){
        if(tok.isTarget && sel.has(ti))  span.classList.add('hit');
        else if(tok.isTarget)             span.classList.add('unselected-target');
        else if(sel.has(ti))              span.classList.add('miss');
      } else {
        span.classList.add('clickable');
        if(sel.has(ti)) span.classList.add('selected');
        span.addEventListener('click',()=>{
          if(sel.has(ti)){ sel.delete(ti); span.classList.remove('selected'); }
          else { sel.add(ti); span.classList.add('selected'); }
          S.answers[q.id]={...(S.answers[q.id]||{}),selected:[...sel]};
        });
      }
      textDiv.appendChild(span);
    });
    body.appendChild(textDiv);
    if(!done){
      const sub=document.createElement('button');
      sub.className='l-mtw-submit';
      sub.textContent='Valider';
      sub.addEventListener('click',()=>{
        const targetIdxs=new Set(tokens.map((t,i)=>t.isTarget?i:-1).filter(i=>i>=0));
        const correct=[...sel].every(i=>targetIdxs.has(i)) && [...targetIdxs].every(i=>sel.has(i));
        S.answers[q.id]={done:true,correct,selected:[...sel]};
        updateScore();
        const newItem=buildListItem(q);
        newItem.classList.add('open');
        item.replaceWith(newItem);
      });
      body.appendChild(sub);
    } else {
      const fb=document.createElement('div');
      fb.className='l-feedback show '+(isCorrect(q)?'ok-fb':'wrong-fb');
      const targets=tokens.filter(t=>t.isTarget).map(t=>t.text);
      fb.innerHTML=isCorrect(q)?'✔ Tous les mots sont correctement surlignés !':
        'Mots attendus : '+targets.map(t=>`<em>${t}</em>`).join(' · ');
      body.appendChild(fb);
    }
  }

  // Tags
  const tagsDiv=document.createElement('div');
  tagsDiv.className='l-tags';
  q.tags.forEach(t=>{ const s=document.createElement('span');s.className='tag';s.textContent=t;tagsDiv.appendChild(s); });
  body.appendChild(tagsDiv);

  return item;
}

function handleListQCMClick(q,idx,choicesDiv,body,item){
  if(!S.answers[q.id]) S.answers[q.id]={picked:[]};
  const a=S.answers[q.id];
  if(q.multi){
    const pi=a.picked.indexOf(idx);
    const btn=choicesDiv.children[idx];
    if(pi>=0){ a.picked.splice(pi,1); btn.style.background=''; }
    else { a.picked.push(idx); btn.style.background='#c5e4f8'; }
    if(!choicesDiv.nextElementSibling?.classList?.contains('validate-multi')){
      const vbtn=document.createElement('div');
      vbtn.className='l-vf-btn vrai validate-multi';
      vbtn.style.margin='6px 0';
      vbtn.textContent='✔ Valider ma sélection';
      vbtn.addEventListener('click',()=>{
        const picked=a.picked||[];
        const correctSet=new Set(q.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0));
        const correct=picked.length===correctSet.size && picked.every(i=>correctSet.has(i));
        S.answers[q.id]={done:true,correct,picked};
        updateScore();
        const newItem=buildListItem(q);
        newItem.classList.add('open');
        item.replaceWith(newItem);
      });
      choicesDiv.after(vbtn);
    }
  } else {
    a.picked=[idx];
    const correctSet=new Set(q.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0));
    const correct=a.picked.length===correctSet.size && a.picked.every(i=>correctSet.has(i));
    S.answers[q.id]={done:true,correct,picked:a.picked};
    updateScore();
    const newItem=buildListItem(q);
    newItem.classList.add('open');
    item.replaceWith(newItem);
  }
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render(){
  if(S.view==='cards') buildCards();
  else buildList();
  updateScore();
}

// ═══════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  S.view=b.dataset.view;
  document.getElementById(`view-${S.view}`).classList.add('active');
  render();
}));

document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');
  S.filter=c.dataset.f;
  render();
}));

document.getElementById('reset-btn').addEventListener('click',()=>{
  if(!confirm('Réinitialiser toutes vos réponses ?')) return;
  S.answers={};
  render();
});

render();
</script>
